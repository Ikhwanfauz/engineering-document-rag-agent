services:
  api:
    build:
      context: .
    command: >
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_PATH: data/database/engineering_document_ai.db
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build:
      context: .
    command: >
      python -m streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      ENGDOC_API_URL: http://api:8000
    depends_on:
      - api
